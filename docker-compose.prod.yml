services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        # All API calls happen in server components, rendered inside this
        # container - never in the browser - so this must be the internal
        # Docker network address, not the public nginx URL.
        NEXT_PUBLIC_API_URL: http://backend:8000
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
